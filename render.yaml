services:
  - type: web
    name: hrushetest-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_ROLE
        value: super-admin
      - key: COOKIE_SAME_SITE
        value: lax
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_DOMAIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: ENABLE_COD
        value: "false"
      - key: OTP_DEV_MODE
        value: "false"
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: HRUSHE
      - key: MAIL_TIMEOUT_MS
        value: "10000"
      - key: ZEPTOMAIL_API_KEY
        sync: false
      - key: ZEPTOMAIL_API_URL
        value: https://api.zeptomail.in/v1.1/email
      - key: ZEPTOMAIL_TEMPLATE_API_URL
        value: https://api.zeptomail.in/v1.1/email/template
      - key: ZEPTOMAIL_TEMPLATE_SIGNUP_OTP
        sync: false
      - key: ZEPTOMAIL_TEMPLATE_WELCOME
        sync: false
      - key: ZEPTOMAIL_TEMPLATE_PASSWORD_RESET_OTP
        sync: false
      - key: ZEPTOMAIL_TEMPLATE_PASSWORD_CHANGED
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
